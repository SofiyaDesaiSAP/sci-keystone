apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: sentryprojects.sentry.sap.cc
spec:
  group: sentry.sap.cc
  names:
    kind: SentryProject
    listKind: SentryProjectList
    plural: sentryprojects
    singular: sentryproject
  scope: Namespaced
  versions:
    - name: v1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          x-kubernetes-preserve-unknown-fields: true
