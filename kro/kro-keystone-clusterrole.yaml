apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    rbac.kro.run/aggregate-to-controller: "true"
  name: kro:controller:keystone-platform
rules:
- apiGroups:
  - kro.run
  resources:
  - keystoneplatforms
  - keystoneplatforms/status
  - keystoneplatforms/finalizers
  verbs:
  - '*'
- apiGroups:
  - delivery.ocm.software
  resources:
  - componentversions
  - resources
  - fluxdeployers
  - localizations
  verbs:
  - '*'
- apiGroups:
  - helm.toolkit.fluxcd.io
  resources:
  - helmreleases
  verbs:
  - '*'
- apiGroups:
  - source.toolkit.fluxcd.io
  resources:
  - helmrepositories
  - ocirepositories
  verbs:
  - '*'
- apiGroups:
  - ""
  resources:
  - namespaces
  - secrets
  - configmaps
  - serviceaccounts
  verbs:
  - get
  - list
  - watch
  - create
  - update
  - patch

