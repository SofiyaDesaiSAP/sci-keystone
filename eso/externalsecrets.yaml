---
# ExternalSecret: keystone-helm-values
#
# Pulls all Keystone secrets from local Vault (mirroring SAP production Vault paths
# with 'test' replacing '<region>') and creates ONE K8s Secret with a 'values.yaml'
# key. Flux HelmRelease consumes it via: valuesFrom[].valuesKey: values.yaml
#
# Production Vault path pattern: secrets/<region>/keystone/...
# Local Vault path pattern:      secrets/test/keystone/...  (mount: 'secrets', KV v2)
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: keystone-helm-values
  namespace: monsoon3
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: vault-store
  target:
    name: keystone-helm-values
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        # This key is consumed by Flux HelmRelease via valuesFrom[].valuesKey: values.yaml
        values.yaml: |
          global:
            dbPassword: "{{ .mariadb_keystone_password }}"
          api:
            adminPassword: "{{ .admin_password }}"
            fernet:
              secrets:
                "0": "{{ .fernet_key_0 }}"
                "1": "{{ .fernet_key_1 }}"
                "2": "{{ .fernet_key_2 }}"
            credentials:
              secrets:
                "0": "{{ .credential_key_0 }}"
                "1": "{{ .credential_key_1 }}"
            cc_radius:
              secret: "{{ .radius_secret }}"
          audit:
            central_service:
              user: "{{ .rabbitmq_username }}"
              password: "{{ .rabbitmq_password }}"
          mariadb:
            root_password: "{{ .mariadb_root_password }}"
            users:
              keystone:
                password: "{{ .mariadb_keystone_password }}"
              backup:
                name: "{{ .mariadb_backup_user }}"
                password: "{{ .mariadb_backup_password }}"
              metis:
                name: "{{ .mariadb_metis_user }}"
                password: "{{ .mariadb_metis_password }}"
          mysql_metrics:
            db_password: "{{ .mariadb_root_password }}"
  data:
    # Keystone admin password
    # Production: secrets/<region>/keystone/keystone-user/admin → password
    - secretKey: admin_password
      remoteRef:
        key: test/keystone/keystone-user/admin
        property: password

    # MariaDB users
    # Production: secrets/<region>/keystone/mariadb-user/keystone → password
    - secretKey: mariadb_keystone_password
      remoteRef:
        key: test/keystone/mariadb-user/keystone
        property: password

    # Production: secrets/<region>/keystone/mariadb-user/root → password
    - secretKey: mariadb_root_password
      remoteRef:
        key: test/keystone/mariadb-user/root
        property: password

    # Production: secrets/<region>/keystone/mariadb-user/backup → user, password
    - secretKey: mariadb_backup_user
      remoteRef:
        key: test/keystone/mariadb-user/backup
        property: user
    - secretKey: mariadb_backup_password
      remoteRef:
        key: test/keystone/mariadb-user/backup
        property: password

    # Production: secrets/<region>/keystone/mariadb-user/metis → username, password
    - secretKey: mariadb_metis_user
      remoteRef:
        key: test/keystone/mariadb-user/metis
        property: username
    - secretKey: mariadb_metis_password
      remoteRef:
        key: test/keystone/mariadb-user/metis
        property: password

    # Fernet keys (token encryption)
    # Production: secrets/<region>/keystone/keystone-fernet-secrets/default → 0, 1, 2
    - secretKey: fernet_key_0
      remoteRef:
        key: test/keystone/keystone-fernet-secrets/default
        property: "0"
    - secretKey: fernet_key_1
      remoteRef:
        key: test/keystone/keystone-fernet-secrets/default
        property: "1"
    - secretKey: fernet_key_2
      remoteRef:
        key: test/keystone/keystone-fernet-secrets/default
        property: "2"

    # Credential encryption keys
    # Production: secrets/<region>/keystone/keystone-credentials-secrets/default → 0, 1
    - secretKey: credential_key_0
      remoteRef:
        key: test/keystone/keystone-credentials-secrets/default
        property: "0"
    - secretKey: credential_key_1
      remoteRef:
        key: test/keystone/keystone-credentials-secrets/default
        property: "1"

    # RabbitMQ for audit notifications (local replaces Hermes)
    # Production: secrets/<region>/hermes/rabbitmq-user/notifications-keystone → username, password
    - secretKey: rabbitmq_username
      remoteRef:
        key: test/hermes/rabbitmq-user/notifications-keystone
        property: username
    - secretKey: rabbitmq_password
      remoteRef:
        key: test/hermes/rabbitmq-user/notifications-keystone
        property: password

    # RADIUS secret (cc_radius auth plugin)
    # Production: secrets/shared/shared/radius-auth/default → secret
    # Using 'test' path for local (no real RADIUS server — dummy value)
    - secretKey: radius_secret
      remoteRef:
        key: test/shared/radius-auth/default
        property: secret
---
# ExternalSecret: seeder-values
#
# Provides the Keystone admin password to the openstack-seeder HelmRelease.
# The seeder needs keystone.password to authenticate to Keystone and seed
# domains, projects, roles, and users.
#
# The password lives at the same Vault path as the keystone admin password
# (secrets/test/keystone/keystone-user/admin → password).
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: seeder-values
  namespace: monsoon3
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: vault-store
  target:
    name: seeder-values
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        values.yaml: |
          keystone:
            password: "{{ .admin_password }}"
  data:
    - secretKey: admin_password
      remoteRef:
        key: test/keystone/keystone-user/admin
        property: password
---
# ExternalSecret: rabbitmq-secrets
# Provides the RabbitMQ password to the Bitnami RabbitMQ HelmRelease
# (auth.existingPasswordSecret reference in rabbitmq-helmrelease.yaml)
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: rabbitmq-secrets
  namespace: monsoon3
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: vault-store
  target:
    name: rabbitmq-secrets
    creationPolicy: Owner
  data:
    - secretKey: password
      remoteRef:
        key: test/hermes/rabbitmq-user/notifications-keystone
        property: password
