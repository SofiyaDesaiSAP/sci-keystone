---
# RabbitMQ — simple Deployment using official Docker Hub image (no Bitnami restrictions).
# Replaces SAP Hermes for Keystone CADF audit notifications.
# No persistence needed for test cluster.
# Password comes from ESO-synced K8s Secret: rabbitmq-secrets
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rabbitmq
  namespace: monsoon3
  labels:
    app: rabbitmq
spec:
  replicas: 1
  selector:
    matchLabels:
      app: rabbitmq
  template:
    metadata:
      labels:
        app: rabbitmq
    spec:
      containers:
        - name: rabbitmq
          image: rabbitmq:3.13-management
          ports:
            - containerPort: 5672
            - containerPort: 15672
          env:
            - name: RABBITMQ_DEFAULT_USER
              value: keystone-notifications
            - name: RABBITMQ_DEFAULT_PASS
              valueFrom:
                secretKeyRef:
                  name: rabbitmq-secrets
                  key: password
          resources:
            requests:
              memory: 256Mi
              cpu: 100m
            limits:
              memory: 512Mi
              cpu: 500m
---
apiVersion: v1
kind: Service
metadata:
  name: rabbitmq
  namespace: monsoon3
spec:
  selector:
    app: rabbitmq
  ports:
    - name: amqp
      port: 5672
      targetPort: 5672
    - name: management
      port: 15672
      targetPort: 15672
