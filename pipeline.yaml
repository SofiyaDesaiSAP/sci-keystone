  - in_parallel:
      steps:
      - file: cc-secrets-tempest-qa-de-1.git/ci/tempest/tasks/run-tempest.yaml
        image: unified-kubernetes-toolbox.image
        input_mapping:
          charts: helm-charts.git
          secrets: cc-secrets-tempest-qa-de-1.git
        on_failure:
          try:
            params:
              channel: '#cc-os-keystone'
              icon_emoji: ':poop:'
              silent: "true"
              text: |
                :boom: <$ATC_EXTERNAL_URL/teams/$BUILD_TEAM_NAME/pipelines/$BUILD_PIPELINE_NAME/jobs/$BUILD_JOB_NAME/builds/$BUILD_NAME|$BUILD_PIPELINE_NAME:$BUILD_JOB_NAME job #$BUILD_NAME failed> :boom::boom: Check the latest results (<https://objectstore-3.qa-de-1.cloud.sap/v1/AUTH_3af1c3304e3c494aa798767243b9e434/reports/keystone/qa-de-1-latest.html|HTML report> or <https://objectstore-3.qa-de-1.cloud.sap/v1/AUTH_3af1c3304e3c494aa798767243b9e434/reports/keystone/qa-de-1-log-latest.tar.gz|log files>)
              username: Concourse
            put: slack-alert
        on_success:
          try:
            params:
              channel: '#cc-os-keystone'
              icon_emoji: ':poop:'
              silent: "true"
              text: |
                :white_check_mark: <$ATC_EXTERNAL_URL/teams/$BUILD_TEAM_NAME/pipelines/$BUILD_PIPELINE_NAME/jobs/$BUILD_JOB_NAME/builds/$BUILD_NAME|$BUILD_PIPELINE_NAME:$BUILD_JOB_NAME job #$BUILD_NAME was successful> :white_check_mark::white_check_mark: Check the latest results (<https://objectstore-3.qa-de-1.cloud.sap/v1/AUTH_3af1c3304e3c494aa798767243b9e434/reports/keystone/qa-de-1-latest.html|HTML report> or <https://objectstore-3.qa-de-1.cloud.sap/v1/AUTH_3af1c3304e3c494aa798767243b9e434/reports/keystone/qa-de-1-log-latest.tar.gz|log files>)
              username: Concourse
            put: slack-alert
        params:
          ARGO_TOKEN: ((argo.token))
          KUBELOGON_PASSWORD: ((unified-kubernetes-auth/default.password))
          KUBELOGON_USER: ((unified-kubernetes-auth/default.username))
          REGION: qa-de-1
          SERVICE: keystone-tempest
          TIMEOUT: "18000"
          VAULT_ROLE_ID: ((auth.role_id))
          VAULT_SECRET_ID: ((auth.secret_id))
        task: run-tempest
      - config:
          image_resource:
            name: ""
            source:
              password: ((registry-user/keppel-ccloud.password))
              repository: keppel.eu-de-1.cloud.sap/ccloud-dockerhub-mirror/library/alpine
              tag: "3.23"
              username: ((registry-user/keppel-ccloud.username))
            type: registry-image
          platform: linux
          run:
            args:
            - -e
            - '\t  HTML report: https://objectstore-3.qa-de-1.cloud.sap/v1/AUTH_3af1c3304e3c494aa798767243b9e434/reports/keystone/qa-de-1-latest.html  \n'
            - '\t  Log files: https://objectstore-3.qa-de-1.cloud.sap/v1/AUTH_3af1c3304e3c494aa798767243b9e434/reports/keystone/qa-de-1-log-latest.tar.gz  \n'
            - \t  If latest is not longer valid then check https://objectstore-3.qa-de-1.cloud.sap/v1/AUTH_3af1c3304e3c494aa798767243b9e434/reports/keystone/  \n
            path: /bin/echo
