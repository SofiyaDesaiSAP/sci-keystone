jobs:
- name: from_pre_production
  plan:
  - in_parallel:
      steps:
      - get: helm-charts.git
        params:
          depth: 100
        passed:
        - qa-de-2-deploy
      - get: script
        params:
          depth: 100
        passed:
        - qa-de-2-deploy
        resource: cc-secrets-ci.git
      - get: unified-kubernetes-toolbox.image
        params:
          skip_download: true
        passed:
        - qa-de-2-deploy
      - get: secrets-source-region.git
        params:
          depth: 100
        passed:
        - qa-de-2-deploy
        resource: cc-secrets-qa-de-2-put.git
      - try:
          get: loci-keystone.docker-image
          params:
            skip_download: true
          passed:
          - qa-de-2-deploy
      - try:
          get: apache-exporter.docker-image
          params:
            skip_download: true
          passed:
          - qa-de-2-deploy
      - try:
          get: statsd-exporter.docker-image
          params:
            skip_download: true
          passed:
          - qa-de-2-deploy
      - try:
          get: proxysql.docker-image
          params:
            skip_download: true
          passed:
          - qa-de-2-deploy
- name: qa-de-2-diff
  plan:
  - in_parallel:
      steps:
      - get: helm-charts.git
        params:
          depth: 100
        trigger: true
      - get: secrets.git
        params:
          depth: 100
        resource: cc-secrets-qa-de-2.git
        trigger: true
      - get: cc-secrets-ci.git
        params:
          depth: 100
        trigger: true
      - get: unified-kubernetes-toolbox.image
      - get: loci-keystone.docker-image
        params:
          skip_download: true
        trigger: true
      - get: apache-exporter.docker-image
        params:
          skip_download: true
        trigger: true
      - get: statsd-exporter.docker-image
        params:
          skip_download: true
        trigger: true
      - get: proxysql.docker-image
        params:
          skip_download: true
        trigger: true
  - config:
      image_resource:
        name: ""
        source:
          repository: keppel.eu-de-1.cloud.sap/ccloud/shared-ci-update-secrets
          tag: latest
        type: registry-image
      inputs:
      - name: cc-secrets-ci.git
      - name: helm-charts.git
      - name: secrets.git
      - name: loci-keystone.docker-image
      - name: apache-exporter.docker-image
      - name: statsd-exporter.docker-image
      - name: proxysql.docker-image
      outputs:
      - name: output
      platform: linux
      run:
        args:
        - -ec
        - |
          source cc-secrets-ci.git/ci/shared/functions.sh
          update_secrets
        path: bash
    output_mapping:
      output: output_versions
    params:
      ADDITIONAL_HELM_ARGS: --allow-unreleased --suppress-secrets
      CHART_PATH: openstack/keystone
      DOCKER_REPO_TOKEN: ((registry-user/keppel-ccloud.password))
      DOCKER_REPO_USER: ((registry-user/keppel-ccloud.username))
      HELM_VALUES: global:db-backup-v2.yaml global:keystone.yaml local:globals local:openstack-globals
        local:keystone.yaml
      KUBELOGON_PASSWORD: ((unified-kubernetes-auth/default.password))
      KUBELOGON_USER: ((unified-kubernetes-auth/default.username))
      NAMESPACE: monsoon3
      PINNED: ""
      REGION: qa-de-2
      RELEASE: keystone
      RELEASE_NAME: epoxy
      USE_DRY_RUN_SERVER: "true"
      VAULT_ADDR: https://vault.global.cloud.sap
      VAULT_KV_ENGINE: secrets
      VAULT_ROLE_ID: ((auth.role_id))
      VAULT_SECRET_ID: ((auth.secret_id))
    task: update-secrets
  - in_parallel:
      steps:
      - try:
          file: cc-secrets-ci.git/ci/shared/task-helm-diff.yaml
          image: unified-kubernetes-toolbox.image
          input_mapping:
            secrets-script.git: cc-secrets-ci.git
            secrets.git: output_versions
          params:
            ADDITIONAL_HELM_ARGS: --allow-unreleased --suppress-secrets
            CHART_PATH: openstack/keystone
            KUBELOGON_PASSWORD: ((unified-kubernetes-auth/default.password))
            KUBELOGON_USER: ((unified-kubernetes-auth/default.username))
            NAMESPACE: monsoon3
            REGION: qa-de-2
            RELEASE: keystone
            USE_DRY_RUN_SERVER: "true"
            VALUES: global:db-backup-v2.yaml global:keystone.yaml local:globals local:openstack-globals
              local:keystone.yaml
            VAULT_ROLE_ID: ((auth.role_id))
            VAULT_SECRET_ID: ((auth.secret_id))
          task: diff
      - file: cc-secrets-ci.git/ci/shared/task-promtool-check.yaml
        image: unified-kubernetes-toolbox.image
        params:
          CHART_PATH: openstack/keystone
          KUBELOGON_PASSWORD: ((unified-kubernetes-auth/default.password))
          KUBELOGON_USER: ((unified-kubernetes-auth/default.username))
          NAMESPACE: monsoon3
          RELEASE: keystone
        task: promtool-check
  - file: cc-secrets-ci.git/ci/shared/task-parse-images-from-helm-diff.yaml
    input_mapping:
      secrets.git: cc-secrets-ci.git
    task: parse-images-from-helm-diff
  - in_parallel:
      steps:
      - try:
          file: cc-secrets-ci.git/ci/shared/task-changelog.yaml
          input_mapping:
            secrets.git: output_versions
          output_mapping:
            output: output_changelog
          params:
            DOCKER_REPO_TOKEN: ((registry-user/keppel-ccloud.password))
            DOCKER_REPO_USER: ((registry-user/keppel-ccloud.username))
            GITHUB_TOKEN: ((github-access-token/sapcc-bot))
            OS_AUTH_URL: https://identity-3.eu-de-1.cloud.sap/v3/
            OS_IDENTITY_API_VERSION: "3"
            OS_PASSWORD: ((keystone-user-password/concourse-eu-de-1))
            OS_PROJECT_ID: caa6209d2c38450f8266311fd0f05446
            OS_USER_DOMAIN_NAME: Default
            OS_USERNAME: concourse
          privileged: true
          task: changelog
      - try:
          file: cc-secrets-ci.git/ci/shared/task-image-vulnerabilities-diff.yaml
          task: image-vulnerabilities-diff
  - try:
      file: cc-secrets-ci.git/ci/shared/task-replicate-changed-images.yaml
      image: unified-kubernetes-toolbox.image
      input_mapping:
        secrets-script.git: cc-secrets-ci.git
      params:
        REGION: qa-de-2
      task: replicate-images
      timeout: 60m
  - get_params:
      depth: 100
    params:
      rebase: true
      repository: output_changelog
    put: cc-secrets-qa-de-2-put.git
  serial: true
- ensure:
    inputs: all
    put: qa-de-2.release
  name: qa-de-2-deploy
  plan:
