        passed:
        - qa-de-2-diff
        resource: cc-secrets-qa-de-2-put.git
      - get: cc-secrets-ci.git
        params:
          depth: 100
        passed:
        - qa-de-2-diff
      - get: unified-kubernetes-toolbox.image
