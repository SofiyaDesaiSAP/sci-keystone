apiVersion: kro.run/v1alpha1
kind: KeystoneStack
metadata:
  name: keystone
  namespace: monsoon3
spec:
  # onSiteRegistry: OCI registry where keystone OCM bundle is stored.
  # deploy-cluster.sh substitutes <on-site-keystone-registry> at deploy time.
  # Example: sci-ocm-bundles-keppel.keppel.eu-nl-1.cloud.sap
  onSiteRegistry: <on-site-keystone-registry>
  registrySecretName: keystone-ocm-registry-creds
  componentVersion: ">=0.13.3"
  valuesSecretName: keystone-helm-values
  seederValuesSecretName: seeder-values
