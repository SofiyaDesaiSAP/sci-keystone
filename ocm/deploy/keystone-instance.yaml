apiVersion: kro.run/v1alpha1
kind: KeystoneStack
metadata:
  name: keystone
  namespace: monsoon3
spec:
  # onSiteRegistry: OCI registry where keystone OCM bundle is stored.
  # For GHCR staging: ghcr.io/<owner>/keystone
  # After `ocm transfer ctf --copy-resources keystone-bundle.ctf oci://rbsc.<site>/keystone`:
  #   onSiteRegistry: rbsc.<site>/keystone
  onSiteRegistry: ghcr.io/sofiyadesaisap/keystone
  registrySecretName: local-registry-creds
  componentVersion: ">=0.13.3"
  valuesSecretName: keystone-helm-values
  seederValuesSecretName: seeder-values
