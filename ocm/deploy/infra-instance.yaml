apiVersion: kro.run/v1alpha1
kind: InfraStack
metadata:
  name: infra
  namespace: monsoon3
spec:
  # onSiteRegistry: OCI registry where prerequisites OCM bundle is stored.
  # deploy-cluster.sh substitutes <on-site-infra-registry> at deploy time.
  # Example: sci-ocm-bundles-keppel.keppel.eu-nl-1.cloud.sap
  onSiteRegistry: <on-site-infra-registry>
  registrySecretName: keystone-ocm-registry-creds
  componentVersion: ">=1.0.0"
  enableVault: true
  enableEso: true
  enableRabbitmq: true
