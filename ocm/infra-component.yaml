# OCM component descriptor — keystone prerequisites bundle.
# Includes platform bootstrap tools (cert-manager, flux, kro, ocm-controller)
# and application prerequisites (vault, eso, rabbitmq).
#
# Variables resolved by `ocm add componentversions --addenv ... KEY=VALUE`:
#   VAULT_VERSION    ESO_VERSION    RABBITMQ_VERSION    INFRA_VERSION
#   VAULT_IMAGE_TAG    VAULT_INJECTOR_TAG    ESO_IMAGE_TAG    RABBITMQ_IMAGE_TAG
#   CERT_MANAGER_VERSION    FLUX_VERSION    KRO_VERSION    OCM_CONTROLLER_VERSION
#
# Charts must be prepared first: make chart-prepare-vault chart-prepare-eso chart-prepare-rabbitmq
# Build:  make build-prerequisites
# Push:   make push-prerequisites
# Sign:   make sign-sigstore-prerequisites

components:

  # ─── Vault ────────────────────────────────────────────────────────────────────
  - name: ocm.software/sap/keystone/infra/vault
    version: ${VAULT_VERSION}
    provider:
      name: sap
    labels:
      - name: sap.com/component
        value: vault
    resources:
      - name: vault-chart
        type: helmChart
        version: ${VAULT_VERSION}
        input:
          type: file
          path: charts/vault-${VAULT_VERSION}.tgz
          mediaType: "application/vnd.cncf.helm.chart.content.v1.tar+gzip"
          compress: false

      - name: vault-image
        type: ociArtifact
        version: "1.0.0"
        access:
          type: ociArtifact
          imageReference: "hashicorp/vault:${VAULT_IMAGE_TAG}"

      - name: vault-injector-image
        type: ociArtifact
        version: "1.0.0"
        access:
          type: ociArtifact
          imageReference: "hashicorp/vault-k8s:${VAULT_INJECTOR_TAG}"


  # ─── External Secrets Operator ────────────────────────────────────────────────
  - name: ocm.software/sap/keystone/infra/eso
    version: ${ESO_VERSION}
    provider:
      name: sap
    labels:
      - name: sap.com/component
        value: external-secrets
    resources:
      - name: eso-chart
        type: helmChart
        version: ${ESO_VERSION}
        input:
          type: file
          path: charts/external-secrets-${ESO_VERSION}.tgz
          mediaType: "application/vnd.cncf.helm.chart.content.v1.tar+gzip"
          compress: false

      - name: eso-image
        type: ociArtifact
        version: "1.0.0"
        access:
          type: ociArtifact
          imageReference: "oci.external-secrets.io/external-secrets/external-secrets:${ESO_IMAGE_TAG}"


  # ─── RabbitMQ ─────────────────────────────────────────────────────────────────
  - name: ocm.software/sap/keystone/infra/rabbitmq
    version: ${RABBITMQ_VERSION}
    provider:
      name: sap
    labels:
      - name: sap.com/component
        value: rabbitmq
    resources:
      - name: rabbitmq-chart
        type: helmChart
        version: ${RABBITMQ_VERSION}
        input:
          type: file
          path: charts/rabbitmq-${RABBITMQ_VERSION}.tgz
          mediaType: "application/vnd.cncf.helm.chart.content.v1.tar+gzip"
          compress: false

      - name: rabbitmq-image
        type: ociArtifact
        version: "1.0.0"
        access:
          type: ociArtifact
          imageReference: "rabbitmq:${RABBITMQ_IMAGE_TAG}"


  # ─── cert-manager ─────────────────────────────────────────────────────────────
  - name: ocm.software/sap/keystone/infra/cert-manager
    version: ${CERT_MANAGER_VERSION}
    provider:
      name: sap
    labels:
      - name: sap.com/component
        value: cert-manager
    resources:
      - name: cert-manager-chart
        type: helmChart
        version: ${CERT_MANAGER_VERSION}
        access:
          type: ociArtifact
          imageReference: "ghcr.io/cloudoperators/greenhouse-extensions/charts/cert-manager:${CERT_MANAGER_VERSION}"


  # ─── Flux ─────────────────────────────────────────────────────────────────────
  - name: ocm.software/sap/keystone/infra/flux
    version: ${FLUX_VERSION}
    provider:
      name: sap
    labels:
      - name: sap.com/component
        value: flux
    resources:
      - name: flux-chart
        type: helmChart
        version: ${FLUX_VERSION}
        access:
          type: ociArtifact
          imageReference: "ghcr.io/fluxcd-community/charts/flux2:${FLUX_VERSION}"


  # ─── kro ──────────────────────────────────────────────────────────────────────
  - name: ocm.software/sap/keystone/infra/kro
    version: ${KRO_VERSION}
    provider:
      name: sap
    labels:
      - name: sap.com/component
        value: kro
    resources:
      - name: kro-chart
        type: helmChart
        version: ${KRO_VERSION}
        access:
          type: ociArtifact
          imageReference: "registry.k8s.io/kro/charts/kro:${KRO_VERSION}"


  # ─── OCM controller ───────────────────────────────────────────────────────────
  - name: ocm.software/sap/keystone/infra/ocm-controller
    version: ${OCM_CONTROLLER_VERSION}
    provider:
      name: sap
    labels:
      - name: sap.com/component
        value: ocm-controller
    resources:
      - name: ocm-controller-chart
        type: helmChart
        version: ${OCM_CONTROLLER_VERSION}
        access:
          type: ociArtifact
          imageReference: "ghcr.io/open-component-model/helm/ocm-controller:${OCM_CONTROLLER_VERSION}"


  # ─── Umbrella / infra top-level component ─────────────────────────────────────
  # References all infra sub-components. Sign this with --recursive to propagate
  # the signature to all referenced components.
  - name: ocm.software/sap/keystone/infra
    version: ${INFRA_VERSION}
    provider:
      name: sap
    labels:
      - name: sap.com/component
        value: keystone-prerequisites
    componentReferences:
      - name: vault
        componentName: ocm.software/sap/keystone/infra/vault
        version: ${VAULT_VERSION}
      - name: eso
        componentName: ocm.software/sap/keystone/infra/eso
        version: ${ESO_VERSION}
      - name: rabbitmq
        componentName: ocm.software/sap/keystone/infra/rabbitmq
        version: ${RABBITMQ_VERSION}
      - name: cert-manager
        componentName: ocm.software/sap/keystone/infra/cert-manager
        version: ${CERT_MANAGER_VERSION}
      - name: flux
        componentName: ocm.software/sap/keystone/infra/flux
        version: ${FLUX_VERSION}
      - name: kro
        componentName: ocm.software/sap/keystone/infra/kro
        version: ${KRO_VERSION}
      - name: ocm-controller
        componentName: ocm.software/sap/keystone/infra/ocm-controller
        version: ${OCM_CONTROLLER_VERSION}
